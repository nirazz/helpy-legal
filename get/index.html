<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- One install link for a message that lands on BOTH platforms (a neighborhood
     WhatsApp group is mixed). A phone goes straight to its own store; anything
     else sees both badges. Link previews read the og tags below - crawlers run
     no script, so they never follow the redirect. -->
<script>
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    // Same referrer the app put on its own invite links, so an Android install
    // from here is still filed as an invite (services/acquisition.ts).
    if (ios) location.replace('https://apps.apple.com/app/helpy-neighborly-help/id6758919822');
    else if (android) location.replace('https://play.google.com/store/apps/details?id=com.neighborlyhelp.app&referrer=utm_source%3Dhelpy_invite%26utm_medium%3Dshare');
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Helpy: שכנים עוזרים אחד לשני</title>
<meta name="description" content="אפליקציה חינמית לאייפון ולאנדרואיד: מפרסמים מה צריך, ושכנים מהאזור עונים.">
<meta property="og:title" content="Helpy: שכנים עוזרים אחד לשני">
<meta property="og:description" content="אפליקציה חינמית לאייפון ולאנדרואיד: מפרסמים מה צריך, ושכנים מהאזור עונים.">
<meta property="og:image" content="https://help-y.com/app-icon-512.png">
<meta property="og:url" content="https://help-y.com/get/">
<meta property="og:site_name" content="Helpy">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/app-icon-512.png">
<link rel="apple-touch-icon" href="/app-icon-512.png">
<style>
  @import url('/fonts/fonts.css');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #0f1115; --ink2: #4a505c; --line: #e3e5e9; --bg: #ffffff;
    --font: "Inter", "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f3f4f6; --ink2: #a1a7b3; --line: #2a2d34; --bg: #0f1115; }
  }
  body {
    font-family: var(--font); background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 48px 16px; text-align: center; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 420px; width: 100%; }
  .icon { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 24px; box-shadow: 0 1px 2px rgba(16,24,40,.12); }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 12px; }
  p { font-size: 17px; line-height: 1.55; color: var(--ink2); margin-bottom: 32px; }
  .badge-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .store-badge {
    display: inline-flex; align-items: center; gap: 11px; flex: 1 1 170px; justify-content: center;
    background: #000; color: #fff; padding: 10px 18px; border-radius: 10px;
    text-decoration: none; border: 1px solid var(--line); direction: ltr;
  }
  .store-badge:hover { background: #1f2024; }
  .store-badge svg { width: 26px; height: 26px; flex-shrink: 0; }
  .badge-text { text-align: left; line-height: 1.1; }
  .badge-small { display: block; font-size: 11px; color: #d4d4d8; }
  .badge-big { display: block; font-size: 18px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
  .more { display: inline-block; margin-top: 32px; font-size: 15px; color: var(--ink2); }
</style>
</head>
<body>
<main>
  <img class="icon" src="/app-icon-512.png" alt="">
  <h1 id="t">Helpy: שכנים עוזרים אחד לשני</h1>
  <p id="d">מפרסמים מה צריך, ושכנים מהאזור עונים. משאילים, מוסרים, נותנים יד. בחינם.</p>
  <div class="badge-row">
    <a href="https://apps.apple.com/app/helpy-neighborly-help/id6758919822" class="store-badge" id="ios" aria-label="הורידו את Helpy מ-App Store">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.86-3.08.41-1.09-.47-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.41C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      <span class="badge-text"><span class="badge-small">Download on the</span><span class="badge-big">App Store</span></span>
    </a>
    <a href="https://play.google.com/store/apps/details?id=com.neighborlyhelp.app&referrer=utm_source%3Dhelpy_invite%26utm_medium%3Dshare" class="store-badge" id="play" aria-label="הורידו את Helpy מ-Google Play">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="gp1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00A0FF"/><stop offset="100%" stop-color="#0064D6"/></linearGradient>
          <linearGradient id="gp2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFE000"/><stop offset="100%" stop-color="#FFBD00"/></linearGradient>
          <linearGradient id="gp3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF3A44"/><stop offset="100%" stop-color="#C31162"/></linearGradient>
          <linearGradient id="gp4" x1="0" y1="0" x2="1" y2="-1"><stop offset="0%" stop-color="#32A071"/><stop offset="100%" stop-color="#2DA771"/></linearGradient>
        </defs>
        <path d="M3.6 2.4c-.4.4-.6 1-.6 1.7v15.8c0 .7.2 1.3.6 1.7L13 12 3.6 2.4z" fill="url(#gp1)"/>
        <path d="M16.6 15.6L13 12l3.6-3.6 4.6 2.6c1.3.7 1.3 1.9 0 2.6l-4.6 2.0z" fill="url(#gp2)"/>
        <path d="M16.6 15.6L13 12 3.6 21.6c.6.6 1.5.7 2.4.2l10.6-6.2z" fill="url(#gp3)"/>
        <path d="M16.6 8.4L6 2.2c-.9-.5-1.8-.4-2.4.2L13 12l3.6-3.6z" fill="url(#gp4)"/>
      </svg>
      <span class="badge-text"><span class="badge-small">Get it on</span><span class="badge-big">Google Play</span></span>
    </a>
  </div>
  <a class="more" id="more" href="/index-he.html">עוד על Helpy</a>
</main>
<script>
  // Hebrew by default (the link travels in Israeli groups); English for a
  // browser that does not ask for Hebrew.
  if (!/^he|^iw/i.test(navigator.language || 'he')) {
    document.documentElement.lang = 'en';
    document.documentElement.dir = 'ltr';
    document.title = 'Helpy: neighbors helping neighbors';
    document.getElementById('t').textContent = 'Helpy: neighbors helping neighbors';
    document.getElementById('d').textContent = 'Post what you need and someone nearby answers. Borrow, give away, lend a hand. Free.';
    document.getElementById('ios').setAttribute('aria-label', 'Download Helpy on the App Store');
    document.getElementById('play').setAttribute('aria-label', 'Get Helpy on Google Play');
    var more = document.getElementById('more');
    more.textContent = 'More about Helpy';
    more.setAttribute('href', '/');
  }
</script>
</body>
</html>
