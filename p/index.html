<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Force HTTPS - must be first, before any render -->
  <script>if(location.protocol==='http:'&&location.hostname!=='localhost'){location.replace('https:'+location.href.slice(5));}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Personal share page: reachable by link, never by search engines -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Helpy Profile</title>
  <meta property="og:title" content="Helpy - Neighborly Help" />
  <meta property="og:description" content="Real neighbors helping each other." />
  <meta property="og:image" content="https://help-y.com/app-icon-512.png" />
  <meta property="og:site_name" content="Helpy" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:image" content="https://help-y.com/app-icon-512.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* Glass card on desktop */
    @media (min-width: 600px) {
      body { padding: 60px 40px; }
      #root {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 32px;
        padding: 48px 40px 40px;
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        box-shadow: 0 40px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
      }
    }

    .wordmark {
      font-size: 11px;
      font-weight: 800;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .avatar {
      width: 112px; height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.8);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.07), 0 20px 48px rgba(0,0,0,0.55);
      margin-bottom: 18px;
    }
    .avatar-ph {
      width: 112px; height: 112px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid rgba(255,255,255,0.8);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.07), 0 20px 48px rgba(0,0,0,0.55);
      margin-bottom: 18px;
      overflow: hidden;
    }

    .name {
      font-size: 28px; font-weight: 700;
      color: #fff;
      letter-spacing: -0.6px;
      margin-bottom: 6px;
    }
    .bio {
      font-size: 15px;
      color: rgba(255,255,255,0.52);
      line-height: 1.5;
      max-width: 270px;
      margin-bottom: 16px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .chip {
      font-size: 12px; font-weight: 600;
      color: rgba(255,255,255,0.65);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 100px;
      padding: 5px 13px;
    }

    .new-badge {
      font-size: 13px; font-weight: 600;
      color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 6px 18px;
      margin-bottom: 24px;
    }

    .stats-row {
      display: flex;
      align-items: stretch;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 6px;
      background: rgba(255,255,255,0.05);
      gap: 5px;
    }
    .stat + .stat { border-left: 1px solid rgba(255,255,255,0.08); }
    html[dir="rtl"] .stat + .stat { border-left: none; border-right: 1px solid rgba(255,255,255,0.08); }
    .stat-val { display: flex; align-items: baseline; gap: 3px; }
    .stat-num {
      font-size: 24px; font-weight: 700;
      color: #fff;
      letter-spacing: -0.8px;
      line-height: 1;
    }
    .stat-star { color: #fbbf24; font-size: 13px; }
    .stat-label {
      font-size: 10px; font-weight: 500;
      color: rgba(255,255,255,0.32);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      line-height: 1.3;
    }

    .reviews { width: 100%; margin-bottom: 24px; text-align: right; }
    html[dir="ltr"] .reviews { text-align: left; }
    .reviews-label {
      font-size: 10px; font-weight: 700;
      color: rgba(255,255,255,0.22);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }
    .review {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .review:last-child { margin-bottom: 0; }
    .review-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .reviewer { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); }
    .review-stars { color: #fbbf24; font-size: 11px; letter-spacing: 1px; }
    .review-body { font-size: 13px; color: rgba(255,255,255,0.48); line-height: 1.5; }

    .badges { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .badge { display: inline-block; }
    .badge img { height: 52px; width: auto; display: block; border-radius: 10px; }
    /* Google's official badge PNG carries built-in padding; oversize + clip so the
       drawn badge matches the Apple one's visual height */
    .badge-play { height: 52px; display: flex; align-items: center; overflow: visible; }
    .badge-play img { height: 78px; width: auto; display: block; margin: 0 -10px; }

    .footer { font-size: 12px; color: rgba(255,255,255,0.18); }

    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: rgba(255,255,255,0.32); }
    .error-title { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.4px; margin-bottom: 8px; }
    .error-sub { font-size: 14px; color: rgba(255,255,255,0.45); line-height: 1.6; margin-bottom: 26px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <p class="loading-text">Loading&hellip;</p>
    </div>
  </div>

  <script>
  (function () {
    var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3b21zdHp6bXllZ3BiaWRpYmZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MTA1NjksImV4cCI6MjA4ODM4NjU2OX0.sZBrK88ecSJBstXNBa2UUAHhBxNfy9-Ssac1JPY9i2k';
    var APP_STORE = 'https://apps.apple.com/app/id6758919822';
    var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.neighborlyhelp.app';

    // Keys mirror the app's category taxonomy (src/data/sampleData.ts categoryConfig);
    // labels mirror useLocalization.ts category.* strings.
    var CAT_EN = {
      'shopping': 'Shopping', 'borrow': 'Borrow', 'handyman': 'Handyman',
      'moving': 'Moving', 'transportation': 'Rides', 'giveaway': 'Giveaway',
      'tech-help': 'Tech Help', 'tutoring': 'Tutoring', 'elderly-care': 'Elderly Care',
      'pro-advice': 'Pro Advice', 'activity': 'Activity', 'other': 'Other'
    };
    var CAT_HE = {
      'shopping': 'קניות', 'borrow': 'השאלה', 'handyman': 'הנדימן',
      'moving': 'הובלות', 'transportation': 'טרמפ', 'giveaway': 'מסירה',
      'tech-help': 'עזרה במחשב', 'tutoring': 'שיעורי עזר', 'elderly-care': 'עזרה לקשישים',
      'pro-advice': 'ייעוץ מקצועי', 'activity': 'פעילות', 'other': 'אחר'
    };

    var T = {
      en: {
        rating: 'Rating', reviews: 'Reviews', helped: 'Helped',
        newToHelpy: '✨ New to Helpy',
        whatNeighborsSay: 'What neighbors say',
        footer: 'Real neighbors helping each other'
      },
      he: {
        rating: 'דירוג', reviews: 'ביקורות', helped: 'עזר/ה',
        newToHelpy: '✨ חדש/ה ב-Helpy',
        whatNeighborsSay: 'מה השכנים אומרים',
        footer: 'שכנים אמיתיים עוזרים אחד לשני'
      }
    };

    var id = window.location.hash.slice(1);
    if (!id) { window.location.href = 'https://help-y.com'; return; }

    fetch('https://lwomstzzmyegpbidibfm.supabase.co/functions/v1/profile-page'
      + '?apikey=' + ANON_KEY + '&id=' + encodeURIComponent(id) + '&format=json')
      .then(function (r) { return r.json(); })
      .then(function (d) { d.error ? showError('gone') : render(d); })
      .catch(function () { showError('load'); });

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function stars(r) {
      var f = Math.round(r); return '&#9733;'.repeat(f) + '&#9734;'.repeat(5-f);
    }

    function render(p) {
      // preferredLanguage until the edge fn ships it; until then (and for users who
      // never set it) a Hebrew-script name is the best signal for page language.
      var isHe = p.preferredLanguage
        ? p.preferredLanguage === 'he'
        : /[\u0590-\u05FF]/.test(p.name || '');
      var t = isHe ? T.he : T.en;
      var CAT = isHe ? CAT_HE : CAT_EN;

      // Apply RTL to the document
      if (isHe) {
        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.setAttribute('lang', 'he');
      }

      document.title = esc(p.name) + ' - Helpy';

      // profiles.avatar holds either an image URL or (mock/demo users) a bare emoji.
      var avatarIsUrl = /^https?:\/\//i.test(p.avatar || '');
      var initial = (p.name || '').trim().charAt(0);
      window.__avatarPh = (p.avatar && !avatarIsUrl) ? p.avatar : (initial || '👤');
      window.__avatarFail = function (img) {
        var ph = document.createElement('div');
        ph.className = 'avatar-ph';
        ph.textContent = window.__avatarPh;
        img.replaceWith(ph);
      };
      var avatarHtml = avatarIsUrl
        ? '<img class="avatar" src="' + esc(p.avatar) + '" alt="" onerror="__avatarFail(this)" />'
        : '<div class="avatar-ph">' + esc(window.__avatarPh) + '</div>';

      var chipsHtml = '';
      if (p.availableCategories && p.availableCategories.length > 0) {
        chipsHtml = '<div class="chips">'
          + p.availableCategories.slice(0, 4).map(function(c) {
              return '<span class="chip">' + esc(CAT[c] || c) + '</span>';
            }).join('')
          + '</div>';
      }

      var hasStats = (p.ratingCount > 0) || (p.helpedCount > 0);
      var statsHtml;
      if (hasStats) {
        var ratingVal = (p.rating && p.ratingCount >= 1)
          ? '<span class="stat-num">' + p.rating.toFixed(1) + '</span><span class="stat-star">&#9733;</span>'
          : '<span class="stat-num">&#8212;</span>';
        statsHtml =
          '<div class="stats-row">'
          + '<div class="stat"><div class="stat-val">' + ratingVal + '</div><span class="stat-label">' + t.rating + '</span></div>'
          + '<div class="stat"><div class="stat-val"><span class="stat-num">' + (p.ratingCount||0) + '</span></div><span class="stat-label">' + t.reviews + '</span></div>'
          + '<div class="stat"><div class="stat-val"><span class="stat-num">' + (p.helpedCount||0) + '</span></div><span class="stat-label">' + t.helped + '</span></div>'
          + '</div>';
      } else {
        statsHtml = '<div class="new-badge">' + t.newToHelpy + '</div>';
      }

      var reviewsHtml = '';
      if (p.reviews && p.reviews.length > 0) {
        reviewsHtml = '<div class="reviews"><p class="reviews-label">' + t.whatNeighborsSay + '</p>';
        p.reviews.forEach(function(r) {
          reviewsHtml +=
            '<div class="review">'
            + '<div class="review-top">'
            + '<span class="reviewer">' + esc(r.rater_name) + '</span>'
            + '<span class="review-stars">' + stars(r.rating) + '</span>'
            + '</div>'
            + '<p class="review-body">' + esc(r.comment) + '</p>'
            + '</div>';
        });
        reviewsHtml += '</div>';
      }

      document.getElementById('root').innerHTML =
        '<p class="wordmark">Helpy</p>'
        + avatarHtml
        + '<h1 class="name">' + esc(p.name) + '</h1>'
        + (p.bio ? '<p class="bio">' + esc(p.bio) + '</p>' : '')
        + chipsHtml
        + statsHtml
        + reviewsHtml
        + '<div class="badges">'
        + '<a class="badge" href="' + APP_STORE + '">'
        + '<img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store" />'
        + '</a>'
        + '<a class="badge badge-play" href="' + PLAY_STORE + '">'
        + '<img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" />'
        + '</a>'
        + '</div>'
        + '<p class="footer">' + t.footer + '</p>';
    }

    // A dead link is still a first impression: keep the page branded and hand
    // the visitor the app instead of a bare error line. Bilingual (Hebrew
    // first - most shares travel in Hebrew-speaking groups).
    function showError(kind) {
      var title = kind === 'gone' ? 'הפרופיל הזה כבר לא זמין' : 'לא הצלחנו לטעון את הפרופיל';
      var sub = kind === 'gone'
        ? 'This profile is no longer available.<br />עוד שכנים עוזרים ונעזרים ב-Helpy'
        : 'Could not load this profile - please try again.<br />אפשר לנסות שוב עוד רגע';
      document.getElementById('root').innerHTML =
        '<p class="wordmark">Helpy</p>'
        + '<p class="error-title">' + title + '</p>'
        + '<p class="error-sub">' + sub + '</p>'
        + '<div class="badges">'
        + '<a class="badge" href="' + APP_STORE + '">'
        + '<img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store" />'
        + '</a>'
        + '<a class="badge badge-play" href="' + PLAY_STORE + '">'
        + '<img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" />'
        + '</a>'
        + '</div>'
        + '<p class="footer">' + T.he.footer + '</p>';
    }
  })();
  </script>
</body>
</html>
