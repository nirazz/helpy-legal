<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- Generated by scripts/build_console_redirect.py - edit that, not this. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-uR+a8VZ6GwHLo1HfOeRy4hJNA0onEVqjSHfE+dMPXKg='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Helpy Console</title>
<noscript><meta http-equiv="refresh" content="0; url=https://helpy-console.pages.dev/"></noscript>
<style>body{font:15px system-ui,sans-serif;max-width:460px;margin:15vh auto;padding:0 16px;color:#0f1115;line-height:1.6}
button{font:inherit;padding:10px 16px;border-radius:10px;border:0;background:#4f46e5;color:#fff;cursor:pointer}
a{color:#4f46e5}</style>
</head>
<body>
<p id="moved">הקונסולה עברה: <a href="https://helpy-console.pages.dev/">helpy-console.pages.dev</a></p>
<div id="ask" hidden>
<p>הקונסולה עברה לאתר חדש. בדפדפן הזה נשמרו מהקונסולה הישנה הגדרות והערות במסמכים (<span id="count"></span>). להעביר אותם?</p>
<p><button id="move" type="button">להעביר ולפתוח את הקונסולה</button> &nbsp; <a id="skip" href="https://helpy-console.pages.dev/">בלי להעביר</a></p>
<p id="msg" role="status"></p>
</div>
<div id="done" hidden>
<p>הועבר (<span id="done-n"></span>). הקונסולה נפתחה בלשונית החדשה, ואפשר לסגור את הלשונית הזו.</p>
</div>
<script>
(function () {
  "use strict";
  var NEW = "https://helpy-console.pages.dev";
  // the old console's settings and the internal documents' saved notes (same lists as
  // migrate.js on the new site); the session itself is never handed over
  var DOC_KEYS = ["helpy_decisions", "helpy_fc_progress_v1", "helpy-checklist-v2", "helpy_survey_runs",
    "helpy-postmortem-v1", "helpy-retro-v1", "helpy_sprint_v2", "helpy_stakeholder_history"];
  var DOC_PREFIXES = ["eng-brief-", "helpy-pmf-", "okr_", "helpy_interview_"];
  var PREFS = ["helpy_console_lang", "helpy_console_theme", "helpy_console_live", "helpy_console_secopen2",
    "helpy_console_tip", "helpy_console_chat_seen", "helpy_console_support_done"];
  var go = NEW + "/" + location.hash;
  var items = {}, n = 0;
  try {
    localStorage.removeItem("helpy_console_auth");
    sessionStorage.removeItem("helpy_dash_key");
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var want = PREFS.indexOf(k) >= 0 || DOC_KEYS.indexOf(k) >= 0 ||
        DOC_PREFIXES.some(function (p) { return k.indexOf(p) === 0; });
      if (want) { items[k] = localStorage.getItem(k); n++; }
    }
  } catch (e) { n = 0; }
  if (!n) { location.replace(go); return; }

  var $ = function (id) { return document.getElementById(id); };
  $("skip").href = go;
  $("count").textContent = String(n);
  $("ask").hidden = false;
  $("moved").hidden = true;
  var w = null, nonce = "", sent = false;
  $("move").addEventListener("click", function () {
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    nonce = Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    sent = false;
    w = window.open(NEW + "/migrate#n=" + nonce, "_blank");
    $("msg").textContent = w ? "מעביר..." : "הדפדפן חסם את הלשונית החדשה. לאפשר חלונות קופצים לאתר הזה ולנסות שוב.";
  });
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!w || e.origin !== NEW || e.source !== w || !d || typeof d !== "object" || d.n !== nonce) return;
    if (d.type === "helpy-migrate-ready" && !sent) {
      sent = true;
      w.postMessage({ type: "helpy-migrate", n: nonce, items: items }, NEW);
    } else if (d.type === "helpy-migrate-ack" && Array.isArray(d.stored)) {
      var gone = 0;
      d.stored.forEach(function (k) {
        if (typeof k === "string" && Object.prototype.hasOwnProperty.call(items, k)) {
          try { localStorage.removeItem(k); gone++; } catch (err) {}
        }
      });
      nonce = "";
      $("ask").hidden = true;
      $("done").hidden = false;
      $("done-n").textContent = String(gone);
    }
  });
})();
</script>
</body>
</html>
